name: taskflow

# Konfigurasi backend dipakai bersama oleh service "migrate" dan "backend".
# Nilai bawaan (setelah ":-") hanya untuk development lokal; untuk produksi
# kredensial datang dari secret manager (Kubernetes Secret / AWS), bukan file ini.
x-backend: &backend
  build: ./backend
  image: taskflow-backend
  environment:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-taskflow}
    DB_PASSWORD: ${DB_PASSWORD:-taskflow_dev_password}
    DB_NAME: ${DB_NAME:-taskflow}
    CORS_ORIGIN: ${CORS_ORIGIN:-}
    TRUST_PROXY: "1" # ada 1 proxy (nginx) di depan backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow_dev_password}
      POSTGRES_DB: ${DB_NAME:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Langkah satu kali: jalankan migrasi lalu selesai (exit 0). Backend menunggu ini.
  migrate:
    <<: *backend
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /ready (bukan /health): backend dianggap sehat hanya jika DB juga terjangkau.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s # lebih besar dari SHUTDOWN_TIMEOUT_MS (10 detik) agar graceful shutdown tuntas
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: taskflow-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
