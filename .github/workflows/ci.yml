name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token bawaan hanya boleh membaca isi repo (prinsip least privilege).
permissions:
  contents: read

# Jika ada push baru ke branch yang sama, batalkan run lama yang masih berjalan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Menjalankan seluruh stack seperti di laptop, lalu mengujinya dari luar.
  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app and test it through nginx
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/tasks > /dev/null; then
              echo "API is up"
              curl -fsS http://localhost:8080/ | grep -q "TaskFlow"
              echo "Frontend is served"
              curl -fsS -X POST http://localhost:8080/api/tasks \
                -H 'Content-Type: application/json' \
                -d '{"title":"CI smoke test"}' | grep -q '"title":"CI smoke test"'
              echo "Create task works end to end (nginx -> backend -> database)"
              exit 0
            fi
            sleep 3
          done
          echo "Stack did not become ready in time"
          exit 1

      - name: Show container status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
