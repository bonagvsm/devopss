server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API diteruskan ke service "backend" (nama service di docker-compose).
  # Di Kubernetes nanti, beri Service backend nama yang sama agar file ini tidak berubah.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ID unik dari nginx; backend memakainya sebagai request ID di log dan respons.
    proxy_set_header X-Request-Id $request_id;
  }

  # File hasil build Vite diberi nama berhash, aman di-cache lama.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback SPA: path lain dikembalikan ke index.html.
  location / {
    try_files $uri /index.html;
  }
}
